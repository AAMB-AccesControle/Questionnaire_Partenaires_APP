<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire d'Évaluation</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .content { padding: 40px; }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input, .question-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .form-group input:focus, .question-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .question-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        .question-section h3 { color: #667eea; margin-bottom: 15px; }
        .question-input {
            margin-bottom: 20px;
            resize: vertical;
            min-height: 80px;
        }
        .answers-container { display: grid; gap: 12px; }
        .answer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }
        .answer-item input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .answer-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #6c757d; margin-top: 10px; }
        .hidden { display: none; }
        .success-message, .error-message {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border-left: 5px solid #dc3545;
        }
        .loading { text-align: center; padding: 40px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Questionnaire d'Évaluation</h1>
            <p>Complétez le questionnaire ci-dessous</p>
        </div>

        <div class="content">
            <div id="identification-section">
                <div class="form-group">
                    <label for="company">Nom de la société *</label>
                    <input type="text" id="company" required>
                </div>
                <div class="form-group">
                    <label for="firstname">Prénom *</label>
                    <input type="text" id="firstname" required>
                </div>
                <div class="form-group">
                    <label for="lastname">Nom *</label>
                    <input type="text" id="lastname" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse email *</label>
                    <input type="email" id="email" required>
                </div>
                <button class="btn" onclick="showQuestions()">Continuer →</button>
            </div>

            <div id="questions-section" class="hidden">
                <div id="message-container"></div>
                
                <div class="question-section">
                    <h3>Question 1</h3>
                    <textarea class="question-input" id="q1" placeholder="Saisissez votre question..."></textarea>
                    <div class="answers-container" id="answers1"></div>
                </div>

                <div class="question-section">
                    <h3>Question 2</h3>
                    <textarea class="question-input" id="q2" placeholder="Saisissez votre question..."></textarea>
                    <div class="answers-container" id="answers2"></div>
                </div>

                <div class="question-section">
                    <h3>Question 3</h3>
                    <textarea class="question-input" id="q3" placeholder="Saisissez votre question..."></textarea>
                    <div class="answers-container" id="answers3"></div>
                </div>

                <div class="question-section">
                    <h3>Question 4</h3>
                    <textarea class="question-input" id="q4" placeholder="Saisissez votre question..."></textarea>
                    <div class="answers-container" id="answers4"></div>
                </div>

                <button class="btn" onclick="validateAndSubmit()">✓ Valider et envoyer</button>
                <button class="btn btn-secondary" onclick="showIdentification()">← Retour</button>
            </div>

            <div id="loading-section" class="hidden loading">
                <div class="spinner"></div>
                <p>Envoi en cours...</p>
            </div>

            <div id="success-section" class="hidden">
                <div class="success-message">
                    <h2>✓ Merci pour votre participation !</h2>
                    <p>Vos réponses ont été enregistrées avec succès.</p>
