name: Save Submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process-submission:
    if: startsWith(github.event.issue.title, 'SUBMISSION: ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process submission
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p submissions
          
          # Extraire le token du titre
          TOKEN=$(echo "${{ github.event.issue.title }}" | sed 's/SUBMISSION: //')
          
          # Créer le fichier JSON
          echo "$ISSUE_BODY" | jq '.' > "submissions/${TOKEN}.json"
          
          # Configurer git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit
          git add "submissions/${TOKEN}.json"
          git commit -m "Submission: ${TOKEN}" || echo "No changes"
          git push
          
          # Fermer l'issue et ajouter un commentaire
          gh issue close "$ISSUE_NUMBER" --comment "✅ Données enregistrées avec succès"
        env:
          GH_TOKEN: ${{ github.token }}
